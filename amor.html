<script>
(function(){

  var canvas=$('matrix'),ctx=canvas.getContext('2d'),stage=$('stage');
  var BIN=Array.from('01010011ABCDEF♥xX<>/\\{}#$%'),LOVE=Array.from('EUTEAMO♥ ');
  var RED=['#ff0020','#b00018','#ff2d3d','#7a0010','#ff4d4d'];
  var PINK=['#ff2d55','#ff0040','#ff69b4','#ff8fab','#ffffff','#ffb3c9'];
  var letters=BIN,colors=RED,alpha=.1;
  var dpr=Math.min(window.devicePixelRatio||1,2),W,H,fs,cols,drops,speeds,cc;
  function pick(){return colors[(Math.random()*colors.length)|0]}
  function setup(){
    W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;
    canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
    fs=Math.max(16,Math.min(26,Math.floor(W/16)));cols=Math.ceil(W/fs);drops=[];speeds=[];cc=[];

    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  }
  var last=0;
  function frame(now){requestAnimationFrame(frame);
    if(now-last<55)return;last=now;
    ctx.fillStyle='rgba(0,0,0,'+alpha+')';ctx.fillRect(0,0,W,H);
    ctx.font='bold '+fs+"px 'Courier New',monospace";ctx.textAlign='center';ctx.textBaseline='middle';
    for(var i=0;i<cols;i++){
      var ch=letters[(Math.random()*letters.length)|0],x=i*fs+fs/2,y=drops[i]*fs;
      ctx.shadowColor=cc[i];ctx.shadowBlur=14;
      ctx.fillStyle=Math.random()<.3?'#fff':cc[i];ctx.fillText(ch,x,y);
      ctx.shadowBlur=0;ctx.globalAlpha=.55;ctx.fillStyle=cc[i];ctx.fillText(ch,x,y-fs);ctx.globalAlpha=1;
      drops[i]+=speeds[i];
      if(y>H+fs&&Math.random()>.965){drops[i]=Math.random()*-25;speeds[i]=.55+Math.random()*1.1;cc[i]=pick();}

  var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
  function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

  var term=$('term'),skip=false,done=false;
  function addLine(t,cls){var el=document.createElement('div');el.className='l '+(cls||'');el.textContent=t;term.appendChild(el);
    while(term.scrollHeight>term.clientHeight&&term.children.length>1)term.removeChild(term.firstChild);return el;}
  async function type(t,cls,sp){var el=addLine('',cls);
    for(var i=1;i<=t.length;i++){if(skip)return;el.textContent=t.slice(0,i);await sleep(sp||22);}
    return el;}
  function hex(n){var s='';for(var i=0;i<n;i++)s+=((Math.random()*16)|0).toString(16);return s;}

  async function run(){
    await sleep(500);
    $('alert').classList.add('on');stage.classList.add('shake');vib([200,80,200,80,400]);flash();
    await sleep(2200);if(skip)return;
    $('alert').classList.remove('on');stage.classList.remove('shake');

    var ip=[192,168,(Math.random()*255)|0,(Math.random()*255)|0].join('.');
    var pre=['> root@invasor:~# ./invadir --alvo=coracao','> rastreando IP '+ip+' ...','> contornando firewall ...',
      '> porta 22 ... ABERTA','> porta 80 ... ABERTA','> porta 443 ... ABERTA','> quebrando criptografia RSA-4096 ...'];
    for(var i=0;i<pre.length;i++){if(skip)return;await type(pre[i],i===0?'k':'',14);await sleep(120);
      if(i===2)flash();}
    for(var n=0;n<14&&!skip;n++){addLine('0x'+hex(8)+'  '+hex(16)+'  '+hex(16),'');await sleep(55);}
    var bar=addLine('','w');
    for(var p=0;p<=100&&!skip;p+=4){var f=Math.round(p/5);
      bar.textContent='[ '+'█'.repeat(f)+'░'.repeat(20-f)+' ] '+p+'%';vib(8);await sleep(70);}
    if(skip)return;
    await sleep(300);addLine('> SENHA DESCOBERTA: **********','w');await sleep(600);

    $('grant').classList.add('on');stage.classList.add('shake');flash('#fff');vib([300,100,300]);
    await sleep(1500);if(skip)return;
    $('grant').classList.remove('on');stage.classList.remove('shake');

    term.innerHTML='';
    letters=LOVE;colors=PINK;alpha=.09;for(var c=0;c<cols;c++)cc[c]=pick();
    var tw=['> acesso total ao sistema...','> ALVO: ♥ SEU CORAÇÃO ♥','> defesas encontradas: 0','> arquivo encontrado: saudade.dll',
      '> arquivo encontrado: pensando_em_voce.exe','> copiando 100% dos meus sentimentos...','> ERRO: impossível deletar. ♥','> STATUS: CORAÇÃO CAPTURADO ✓'];
    for(var j=0;j<tw.length;j++){if(skip)return;await type(tw[j],j===tw.length-1?'k':'p',40);await sleep(300);}
    await sleep(700);showFinal();
  }

  var glyphs=['❤️','💖','💗','💕','♥'];
  function heart(x,y,spread){var el=document.createElement('div');el.className='fh';
    el.textContent=glyphs[(Math.random()*glyphs.length)|0];el.style.left=x+'px';el.style.top=y+'px';
    el.style.fontSize=(16+Math.random()*26)+'px';el.style.setProperty('--x',((Math.random()-.5)*spread)+'px');
    el.style.setProperty('--y',(-(120+Math.random()*260))+'px');el.style.setProperty('--r',((Math.random()-.5)*50)+'deg');
    var d=2.4+Math.random()*1.8;el.style.setProperty('--d',d+'s');document.body.appendChild(el);
    setTimeout(function(){el.remove()},d*1000+100);}
  function showFinal(){if(done)return;done=true;skip=true;
    $('alert').classList.remove('on');$('grant').classList.remove('on');stage.classList.remove('shake');
    letters=LOVE;colors=PINK;alpha=.09;for(var c=0;c<cols;c++)cc[c]=pick();
    flash('#ff2d55');vib([120,60,120,60,300]);$('final').classList.add('show');
    for(var k=0;k<26;k++)(function(k){setTimeout(function(){heart(Math.random()*W,H*.75,200)},k*70)})(k);
    setInterval(function(){heart(Math.random()*W,H-10,120)},320);
    setTimeout(function(){$('hint').classList.add('show')},2400);}
  function tap(e){var p=(e.touches&&e.touches[0])||e;
    if(!done){showFinal();return;}
    for(var k=0;k<7;k++)heart(p.clientX+(Math.random()-.5)*30,p.clientY,160);}
  document.addEventListener('touchstart',tap,{passive:true});
  document.addEventListener('click',function(e){if(!('ontouchstart' in window))tap(e)});
  addEventListener('resize',function(){dpr=Math.min(devicePixelRatio||1,2);setup()});
  setup();requestAnimationFrame(frame);run();
})();
